name: CI

on:
  push:
    branches: [master, main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build & test (mvn verify：cargo build/test + Java compile + JNI 端到端)
        run: mvn -B --no-transfer-progress verify

      - name: Upload platform jar
        uses: actions/upload-artifact@v4
        with:
          name: xdvjni-${{ matrix.os }}
          path: target/xdvjni-0.1.0.jar
          if-no-files-found: error

  universal-jar:
    name: universal jar（合并三平台本地库）
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 收集三平台本地库
        run: |
          mkdir -p prebuilt-natives
          unzip -j -o artifacts/xdvjni-ubuntu-latest/xdvjni-0.1.0.jar 'xdvjni/native/*' -d prebuilt-natives
          unzip -j -o artifacts/xdvjni-macos-latest/xdvjni-0.1.0.jar  'xdvjni/native/*' -d prebuilt-natives
          unzip -j -o artifacts/xdvjni-windows-latest/xdvjni-0.1.0.jar 'xdvjni/native/*' -d prebuilt-natives
          ls -la prebuilt-natives

      - name: 组装全平台 jar
        run: mvn -B --no-transfer-progress -DskipTests -Dnative.prebuilt.dir=$PWD/prebuilt-natives package

      - name: Upload universal jar
        uses: actions/upload-artifact@v4
        with:
          name: xdvjni-universal
          path: target/xdvjni-0.1.0.jar
          if-no-files-found: error

  release:
    name: release（tag 推送时发布）
    needs: [build, universal-jar]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 重命名产物
        run: |
          mv artifacts/xdvjni-ubuntu-latest/xdvjni-0.1.0.jar  xdvjni-0.1.0-linux-x86_64.jar
          mv artifacts/xdvjni-macos-latest/xdvjni-0.1.0.jar   xdvjni-0.1.0-macos.jar
          mv artifacts/xdvjni-windows-latest/xdvjni-0.1.0.jar xdvjni-0.1.0-windows-x86_64.jar
          mv artifacts/xdvjni-universal/xdvjni-0.1.0.jar      xdvjni-0.1.0-all.jar

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            xdvjni-0.1.0-linux-x86_64.jar
            xdvjni-0.1.0-macos.jar
            xdvjni-0.1.0-windows-x86_64.jar
            xdvjni-0.1.0-all.jar
          generate_release_notes: true
